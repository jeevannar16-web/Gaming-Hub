name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default to the least privilege for every job. The deploy job opts back in to
# exactly the two permissions it needs, so a compromised or mistyped step in one
# job cannot reach the rest of the repo.
permissions:
  contents: read

# Never run two deploys at once; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to a full commit SHA rather than a mutable tag, so the
      # exact code that was reviewed is the code that runs. Bump with the
      # comment naming the human-readable version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vite 7 requires Node ^20.19 || >=22.12.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            games/pickora/package-lock.json

      # Hub dependencies
      - name: Install hub dependencies
        run: npm ci --no-fund

      # Fail the deploy rather than shipping a build with known vulnerable
      # dependencies.
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      # Build every game in games/* and stage it into public/, then build the hub.
      - name: Build hub and games
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to Pages
      id-token: write   # proves the request to Pages comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4