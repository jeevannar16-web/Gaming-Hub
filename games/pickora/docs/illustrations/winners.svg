<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0618"/>
      <stop offset="1" stop-color="#1B1140"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- glow behind winning wheel -->
  <circle cx="320" cy="195" r="220" fill="url(#glow)"/>

  <!-- wheel -->
  <g stroke="#0A0618" stroke-width="2">
    <path d="M320 200 L320 120 A80 80 0 0 1 376.6 143.4 Z" fill="#8B5CF6"/>
    <path d="M320 200 L376.6 143.4 A80 80 0 0 1 400 200 Z" fill="#22D3EE"/>
    <path d="M320 200 L400 200 A80 80 0 0 1 376.6 256.6 Z" fill="#F472B6"/>
    <path d="M320 200 L376.6 256.6 A80 80 0 0 1 320 280 Z" fill="#4BE59B" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M320 200 L320 280 A80 80 0 0 1 263.4 256.6 Z" fill="#F59E0B"/>
    <path d="M320 200 L263.4 256.6 A80 80 0 0 1 240 200 Z" fill="#818CF8"/>
    <path d="M320 200 L240 200 A80 80 0 0 1 263.4 143.4 Z" fill="#2DD4BF"/>
    <path d="M320 200 L263.4 143.4 A80 80 0 0 1 320 120 Z" fill="#A78BFA"/>
  </g>
  <circle cx="320" cy="200" r="90" fill="none" stroke="#F8FAFC" stroke-width="6" opacity="0.15"/>
  <polygon points="320,88 330,110 310,110" fill="#F8FAFC"/>
  <circle cx="320" cy="200" r="18" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/>
  <g transform="translate(320 200) scale(1.1)">
    <path d="M16 5 L19.2 12.5 L26 13.8 L21 19.2 L22.5 26 L16 21.8 L9.5 26 L11 19.2 L6 13.8 L12.8 12.5 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- crown over the winner -->
  <g transform="translate(320 46)">
    <rect x="-14" y="20" width="28" height="7" rx="2" fill="#FBBF24"/>
    <polygon points="-16,22 -13,2 -3,13 0,2 3,13 13,2 16,22" fill="#FBBF24"/>
    <circle cx="0" cy="24" r="2.4" fill="#F43F5E"/>
  </g>

  <!-- confetti burst -->
  <g>
    <rect x="180" y="40" width="8" height="5" rx="1" transform="rotate(25 184 42)" fill="#22D3EE"/>
    <rect x="430" y="36" width="8" height="5" rx="1" transform="rotate(-20 434 38)" fill="#F472B6"/>
    <circle cx="250" cy="60" r="4" fill="#F59E0B"/>
    <circle cx="390" cy="58" r="4" fill="#34D399"/>
    <rect x="150" y="90" width="7" height="5" rx="1" transform="rotate(-40 153 92)" fill="#8B5CF6"/>
    <rect x="480" y="80" width="7" height="5" rx="1" transform="rotate(35 483 82)" fill="#F59E0B"/>
    <circle cx="130" cy="140" r="5" fill="#34D399"/>
    <circle cx="510" cy="130" r="5" fill="#22D3EE"/>
    <rect x="120" y="200" width="8" height="5" rx="1" transform="rotate(30 124 202)" fill="#F472B6"/>
    <rect x="515" y="150" width="8" height="5" rx="1" transform="rotate(-25 519 152)" fill="#8B5CF6"/>
    <rect x="95" y="180" width="7" height="6" rx="1" transform="rotate(15 98 183)" fill="#F59E0B"/>
    <circle cx="560" cy="300" r="5" fill="#F472B6"/>
