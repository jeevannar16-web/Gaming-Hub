  <!-- winner history card -->
  <g>
    <rect x="60" y="292" width="230" height="92" rx="14" fill="#17102E" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="86" cy="322" r="7" fill="#8B5CF6"/>
    <rect x="104" y="319" width="120" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
    <path d="M240 316 l6 6 10 -11" stroke="#4BE59B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="86" cy="344" r="7" fill="#22D3EE"/>
    <rect x="104" y="341" width="90" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
    <path d="M206 338 l6 6 10 -11" stroke="#4BE59B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="86" cy="366" r="7" fill="#F59E0B"/>
    <rect x="104" y="363" width="130" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
    <path d="M248 360 l6 6 10 -11" stroke="#4BE59B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- summary chip -->
  <g>
    <rect x="360" y="318" width="220" height="48" rx="24" fill="#7C3AED" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="392" cy="342" r="9" fill="#FFFFFF" opacity="0.9"/>
    <g transform="translate(392 342) scale(0.62)"><path d="M16 5 L19.2 12.5 L26 13.8 L21 19.2 L22.5 26 L16 21.8 L9.5 26 L11 19.2 L6 13.8 L12.8 12.5 Z" fill="#7C3AED"/></g>
    <rect x="412" y="336" width="96" height="7" rx="3.5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="412" y="351" width="62" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
  </g>
